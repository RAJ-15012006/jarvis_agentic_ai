<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      min-height: 180px;
      background: #0a0f1e;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #00c6ff, #0072ff);
      box-shadow: 0 0 14px #0072ff66;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    h1 { font-size: 15px; font-weight: 700; color: #60a5fa; letter-spacing: 1px; }
    p.sub { font-size: 11px; color: #64748b; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #111827;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    .dot.off { background: #ef4444; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text { font-size: 12px; }

    .btn {
      width: 100%;
      padding: 9px 14px;
      background: linear-gradient(135deg, #1d4ed8, #0072ff);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn.secondary {
      background: #1e293b;
      margin-top: 6px;
      color: #94a3b8;
    }

    .note { font-size: 10px; color: #475569; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚙</div>
    <div>
      <h1>JARVIS AGENT</h1>
      <p class="sub">Browser Control Module</p>
    </div>
  </div>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
  </div>

  <button class="btn" id="openJarvis">Open JARVIS UI</button>
  <button class="btn secondary" id="closeTab">Close This Tab</button>

  <p class="note">JARVIS is listening for your voice commands.<br/>Say "close all tabs" to close everything.</p>

  <script src="popup.js"></script>
</body>
</html>
